version: "3.9"

name: socialsphere

x-common-env: &common-env
  NODE_ENV: development
  TRAINING_MODE: "true"

services:
  # ─────────────────────────────────────────────
  # Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ss-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Frontend — Next.js
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ss-frontend
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_URL: http://localhost:80/api
      NEXT_PUBLIC_WS_URL: ws://localhost:80
      NEXT_PUBLIC_MODE: training
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Backend — Express
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ss-backend
    environment:
      <<: *common-env
      PORT: 4000
      DATABASE_URL: postgresql://socialsphere:socialsphere@postgres:5432/socialsphere
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: socialsphere
      JWT_SECRET: super_weak_secret_for_training_do_not_use_in_production
      JWT_REFRESH_SECRET: another_weak_secret_training_only
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@socialsphere.local
      OAUTH_GOOGLE_CLIENT_ID: training_client_id
      OAUTH_GOOGLE_CLIENT_SECRET: training_client_secret
      OAUTH_CALLBACK_URL: http://localhost/api/auth/oauth/google/callback
      SESSION_SECRET: weak_session_secret_training_only
      LDAP_URL: ldap://openldap:389
      LDAP_BASE_DN: dc=socialsphere,dc=local
      LDAP_BIND_DN: cn=admin,dc=socialsphere,dc=local
      LDAP_BIND_PASSWORD: adminpassword
      PROMETHEUS_ENABLED: "true"
      CORS_ORIGINS: "http://localhost,http://localhost:3000"
      # ⚠️ Training mode: intentionally weak configs
      BCRYPT_ROUNDS: 4
      DISABLE_RATE_LIMIT: "true"
      SHOW_STACK_TRACES: "true"
      DISABLE_CSRF: "true"
      ALLOW_ALL_CORS: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    ports:
      - "4000:4000"
      - "9229:9229"  # Node.js debugger
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Database — PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ss-postgres
    environment:
      POSTGRES_DB: socialsphere
      POSTGRES_USER: socialsphere
      POSTGRES_PASSWORD: socialsphere
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - socialsphere
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialsphere -d socialsphere"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Cache — Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ss-redis
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - socialsphere
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Object Storage — MinIO
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ss-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - socialsphere
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Email — MailHog
  # ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ss-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # LDAP — OpenLDAP (for LDAP injection lab)
  # ─────────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    container_name: ss-openldap
    environment:
      LDAP_ORGANISATION: SocialSphere
      LDAP_DOMAIN: socialsphere.local
      LDAP_ADMIN_PASSWORD: adminpassword
      LDAP_CONFIG_PASSWORD: configpassword
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
      - "636:636"
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Monitoring — Prometheus
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ss-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Monitoring — Grafana
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ss-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - socialsphere
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Worker — Background Jobs
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ss-worker
    command: ["node", "-r", "ts-node/register", "src/worker.ts"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://socialsphere:socialsphere@postgres:5432/socialsphere
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - socialsphere
    restart: unless-stopped

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  socialsphere:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  minio_data:
  ldap_data:
  ldap_config:
  prometheus_data:
  grafana_data:
  uploads:
